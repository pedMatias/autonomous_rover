# Waveshare UGV Rover baseline (mainType=2, 6WD).
# In the official Waveshare firmware (ugv_base_ros):
#   WHEEL_D = 0.0800 m (80 mm wheel diameter)
#   ONE_CIRCLE_PLUSES = 660
#   en_odom_l = (encoderPulsesA / 660.0) * 0.08 * pi
#   odl = (long int)(en_odom_l * 100) -> 1 unit = 0.01 m (1 cm)
#   TRACK_WIDTH = 0.172 m (172 mm physical track width)
#
# Dropped initial empirical trials in favor of official manufacturer defaults.
telemetry_distance_unit: cm
meters_per_left_unit: 0.01
meters_per_right_unit: 0.01

physical_track_width_m: 0.172
track_width_m: 0.172
left_encoder_sign: 1
right_encoder_sign: 1
gyro_bias_x: -8.615771812080537
gyro_bias_y: 4.4630872483221475
gyro_bias_z: -6.340604026845638
low_battery_warn_v: 10.8
low_battery_stop_v: 9.9

rover_avoidance:
  ros__parameters:
    goal_topic: /avoidance/goal_relative
    odom_topic: /odom
    depth_topic: /camera/depth/image_raw/compressedDepth
    camera_info_topic: /oak/rgb/camera_info
    cmd_vel_topic: /cmd_vel
    status_topic: /avoidance/status
    base_frame: base_link
    tick_rate_hz: 10.0
    # Low-speed commands stall the motors against floor friction and pull stall
    # current until the rover browns out. 0.35 m/s is the minimum forward speed;
    # see docs/rover_low_speed_stall.md.
    max_linear_speed_mps: 0.35
    max_angular_speed_rps: 0.65
    wheel_separation_m: 0.172
    max_wheel_speed_mps: 0.5
    min_wheel_speed_mps: 0.05
    # Turns are forward arcs, with both wheels moving in the same direction.
    min_align_rate_rps: 0.5
    heading_gain: 1.2
    # Turn until inside align_tolerance_rad, then keep driving until the
    # heading error exceeds it again. Wheel-count yaw is quantized in ~3.3 deg
    # steps, so a single threshold chatters between turning and driving.
    align_tolerance_rad: 0.12
    align_release_ratio: 0.5
    # Wheel-count yaw is quantized in ~3.3 deg steps, so the steering estimate
    # is low-pass filtered. 0.3 s averages the count wobble without adding
    # noticeable lag while rotating.
    yaw_filter_time_constant_s: 0.3
    goal_tolerance_m: 0.15
    # Experimental: 0.18 m plus the arc check's 0.025 m buffer; may clip obstacles.
    obstacle_clearance_m: 0.18
    obstacle_min_height_m: 0.04
    obstacle_max_height_m: 0.75
    obstacle_lookahead_m: 1.2
    depth_min_m: 0.2
    depth_max_m: 3.0
    depth_decimation: 8
    min_valid_depth_fraction: 0.08
    # Zero and beyond-range depth pixels are stereo dropouts, not obstacles.
    # Set true to restore the conservative "unknown space blocks the path" rule.
    missing_depth_blocks_paths: false
    sensor_timeout_s: 0.6
    debug_enabled: true
    # Preview-only search idea; not used for live /cmd_vel control.
    preview_search_max_step_m: 1.0
    preview_search_stop_margin_m: 0.3